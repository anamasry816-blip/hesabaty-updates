<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تفعيل البرنامج</title><style>body{font-family:Tahoma,sans-serif;background:#0f172a;color:#e5e9f0;display:grid;place-items:center;min-height:100vh;margin:0}.c{background:#16203a;border-radius:14px;padding:28px;width:min(500px,92vw);box-shadow:0 12px 40px rgba(0,0,0,.25)}h2{margin-top:0}code{display:block;background:#0b1220;padding:11px;border-radius:8px;direction:ltr;text-align:center;font-size:18px;letter-spacing:2px;margin:8px 0}textarea{width:100%;height:105px;box-sizing:border-box;border-radius:8px;border:1px solid #334155;background:#0b1220;color:#fff;padding:10px;direction:ltr;font-family:Consolas,monospace}button{margin-top:10px;padding:10px 18px;border:0;border-radius:8px;background:#0f766e;color:#fff;font:inherit;cursor:pointer}button.alt{background:#475569}#m{color:#fca5a5;margin-top:10px}.row{display:flex;gap:8px;flex-wrap:wrap}</style></head><body><div class="c"><h2>🔒 انتهت الفترة التجريبية</h2><p>أدخل كود التفعيل المخصص لهذا الجهاز. يمكنك أيضًا تفعيل البرنامج أثناء الفترة التجريبية من زر «تفعيل البرنامج» داخل حساباتي.</p><b>كود الجهاز</b><code id="mc"></code><div class="row"><button class="alt" onclick="navigator.clipboard.writeText(mc.textContent).then(()=>m.textContent='تم نسخ كود الجهاز')">نسخ كود الجهاز</button></div><p>كود التفعيل:</p><textarea id="k" placeholder="الصق كود التفعيل هنا"></textarea><div class="row"><button onclick="go()">تفعيل</button></div><div id="m"></div></div><script>mc.textContent=api.licMachine();async function go(){m.textContent='';const r=await api.licActivate(k.value);if(!r.ok)m.textContent=r.msg}</script></body></html>
