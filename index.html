/* ===== الشكل الجديد (طبقة تصميم فوق الأساس — لا تغيّر أي وظيفة) ===== */

/* ===== الشكل الحديث النظيف (طبقة تصميم — لا تغيّر أي وظيفة) ===== */
:root{--navy:#0f172a;--blue:#0f766e;--blue2:#0d6a63;--green:#16a34a;--orange:#d97706;--red:#dc2626;--bg:#f6f7f9;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e5e7eb;--th:#f8fafc;--sh:0 1px 2px rgba(15,23,42,.04);--sh2:0 8px 24px rgba(15,23,42,.10);--r:10px;--side:#fff;--hov:#f1f5f9;--act:#e6f4f1}

M['./QRMath']=function(module,require){var QRMath = {

	glog : function(n) {
	
		if (n < 1) {
			throw new Error("glog(" + n + ")");
		}
		
		return QRMath.LOG_TABLE[n];
	},
	
	gexp : function(n) {
	
		while (n < 0) {
			n += 255;
		}
	
		while (n >= 256) {
			n -= 255;
		}
	
		return QRMath.EXP_TABLE[n];
	},
	
	EXP_TABLE : new Array(256),
	
	LOG_TABLE : new Array(256)

};

	QRMath.EXP_TABLE[i] = 1 << i;
}

	QRMath.EXP_TABLE[i] = QRMath.EXP_TABLE[i - 4]
		^ QRMath.EXP_TABLE[i - 5]
		^ QRMath.EXP_TABLE[i - 6]
		^ QRMath.EXP_TABLE[i - 8];

	QRMath.LOG_TABLE[QRMath.EXP_TABLE[i] ] = i;
}

M['./QRPolynomial']=function(module,require){var QRMath = require('./QRMath');

function QRPolynomial(num, shift) {
	if (num.length === undefined) {
		throw new Error(num.length + "/" + shift);
	}

	var offset = 0;

	while (offset < num.length && num[offset] === 0) {
		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}
}

QRPolynomial.prototype = {

	get : function(index) {
		return this.num[index];
	},
	
	getLength : function() {
		return this.num.length;
	},
	
	multiply : function(e) {
	
		var num = new Array(this.getLength() + e.getLength() - 1);
	
		for (var i = 0; i < this.getLength(); i++) {
			for (var j = 0; j < e.getLength(); j++) {
				num[i + j] ^= QRMath.gexp(QRMath.glog(this.get(i) ) + QRMath.glog(e.get(j) ) );
			}
		}
	
		return new QRPolynomial(num, 0);
	},
	
	mod : function(e) {
	
		if (this.getLength() - e.getLength() < 0) {
			return this;
		}
	
		var ratio = QRMath.glog(this.get(0) ) - QRMath.glog(e.get(0) );
	
		var num = new Array(this.getLength() );
		
		for (var i = 0; i < this.getLength(); i++) {
			num[i] = this.get(i);
		}
		
		for (var x = 0; x < e.getLength(); x++) {
			num[x] ^= QRMath.gexp(QRMath.glog(e.get(x) ) + ratio);
		}
	
		// recursive call
		return new QRPolynomial(num, 0).mod(e);
	}
};

module.exports = QRPolynomial;

};
M['./QRBitBuffer']=function(module,require){function QRBitBuffer() {
	this.buffer = [];
	this.length = 0;
}

QRBitBuffer.prototype = {

	get : function(index) {
		var bufIndex = Math.floor(index / 8);
		return ( (this.buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
	},
	
	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},
	
	getLengthInBits : function() {
		return this.length;
	},
	
	putBit : function(bit) {
	
		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {
			this.buffer.push(0);
		}
	
		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );
		}
	
		this.length++;
	}
};

module.exports = QRBitBuffer;

};

const licPrompt=()=>{if(!A||!A.licMachine||!A.licActivate)return;const m=A.licMachine();const d=document.createElement('div');d.id='licm';d.innerHTML=`<div class="card"><h2 style="padding:0;margin:0">🔑 تفعيل البرنامج</h2><p class="mu" style="margin:0">يمكنك التفعيل الآن أو في أي وقت خلال الفترة التجريبية باستخدام كود مخصص لهذا الجهاز.</p><b>كود الجهاز</b><div class="machine">${e(m)}</div><button class="b sm" type="button" id="lic-copy">نسخ كود الجهاز</button><label>كود التفعيل<textarea id="lkm" placeholder="الصق كود التفعيل هنا"></textarea></label><div class="ua"><button class="b gr" onclick="actLicModal()">تفعيل</button><button class="b rd sm" onclick="$('#licm').remove()">إلغاء</button></div></div>`;document.body.appendChild(d);const cp=d.querySelector('#lic-copy');cp.onclick=async()=>{try{await navigator.clipboard.writeText(m);msg('تم نسخ كود الجهاز')}catch(_){const t=document.createElement('textarea');t.value=m;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();msg('تم نسخ كود الجهاز')}};setTimeout(()=>$('#lkm').focus(),50)};
const actLicModal=async()=>{const r=await A.licActivate(val('lkm'));if(!r.ok)msg(r.msg)};

let wz=0;const wzNeeded=()=>!D.co.done&&!D.items.length&&!D.sales.length&&!D.cust.length;
const wzHtml=()=>{const c=D.co,S=[`${inp('w1','اسم الشركة / المحل',c.name||'')}${inp('w2','رقم الهاتف',c.ph||'')}${inp('w3','العنوان',c.ad||'')}`,`${inp('w4','نسبة ضريبة القيمة المضافة % (اكتب 0 لو غير مسجّل)',c.vat||0,'number')}${inp('w5','الرقم الضريبي',c.tx||'')}<label>مقاس الفاتورة<select id="w6"><option value="">A4</option><option value="80" ${c.pp=='80'?'selected':''}>رول 80mm (كاشير)</option></select></label>`,`<p>أوشكنا على الانتهاء. كلمة المرور الافتراضية للمستخدمين سيطلب منك البرنامج تغييرها عند أول دخول.</p>${A?`<button class="b sm" onclick="A.bkdir(true).then(d=>msg('مجلد النسخ: '+d))">📁 اختيار مجلد النسخ الاحتياطي</button><p class="mu">يُفضّل قرص أو فلاشة مختلفة عن قرص البرنامج.</p>`:''}`];
return `<div class="lg"><div class="card"><h2 style="text-align:center">إعداد البرنامج — خطوة ${wz+1} من 3</h2>${S[wz]}<div class="uh">${wz?'<button class="b gr" onclick="wz--;R()">السابق</button>':'<span></span>'}<button class="b" onclick="wzNext()">${wz==2?'ابدأ الاستخدام':'التالي'}</button></div></div></div>`};
const wzNext=()=>{const c=D.co;if(wz==0){const n=val('w1').trim();if(!n)return msg('اكتب اسم الشركة');Object.assign(c,{name:n,ph:val('w2'),ad:val('w3')})}if(wz==1)Object.assign(c,{vat:+val('w4')||0,tx:val('w5'),pp:val('w6')});if(wz<2)wz++;else{c.done=1;wz=0}save();R()};
const HELP=[['إضافة صنف','من صفحة "الأصناف" اكتب الاسم والأسعار والرصيد الافتتاحي والحد الأدنى ثم "إضافة صنف". يمكنك استيراد الأصناف من Excel من نفس الصفحة.'],['عمل فاتورة بيع','من "المبيعات": اختر الصنف أو امسح الباركود، حدد الكمية، ثم احفظ الفاتورة. للآجل اختر العميل. زر "بيع سريع" يضيف الأصناف الأكثر مبيعًا بضغطة.'],['تحصيل من عميل أو سداد لمورد','من "الخزينة" اختر "تحصيل من عميل" أو "سداد لمورد" وحدد الطرف والمبلغ، وسينخفض رصيده.'],['المرتجعات','من فاتورة موجودة اختر "مرتجع" ثم الأصناف والكميات، وسيتم عكس أثرها على المخزون والحسابات.'],['التقسيط','من صفحة "التقسيط" أنشئ خطة لعميل، وعند وصول القسط اضغط "تحصيل" ليدخل الخزينة ويخصم من رصيده.'],['جرد المخزون','من "جرد المخزون" اكتب الكمية الفعلية فيظهر الفرق، ثم "اعتماد الجرد" لتعديل الأرصدة.'],['النسخ الاحتياطي','يُحفظ نسخة تلقائيًا كل يوم في المجلد المحدد. يمكنك أخذ نسخة يدوية أو استرجاعها من أعلى الشاشة. غيّر المجلد من "بيانات الشركة".'],['قفل الشاشة والمستخدمون','من "بيانات الشركة" تحدد مدة القفل عند عدم الاستخدام. المدير يضيف مستخدمين ويحدد صلاحياتهم من "المستخدمون".'],['تقرير الضريبة وقائمة الدخل','اختر الشهر ثم اضغط "طباعة / PDF" أو "تصدير CSV" لتسليمه للمحاسب.']];
P.help=()=>{const i=A&&A.info?A.info():{version:'web',lic:null},l=i.lic;
return `<h2>المساعدة وعن البرنامج</h2><div class="card"><b>حساباتي</b> — برنامج المبيعات والمشتريات والمحاسبة<p class="mu">الإصدار ${e(i.version)} — Powered by Ahmed Alshafy</p>${l?`<p>الترخيص: ${l.mode=='licensed'?`<span class="pos">مفعّل${l.name?' — '+e(l.name):''}${l.exp?' حتى '+new Date(l.exp).toLocaleDateString('ar-EG'):' (دائم)'}</span>`:`<span class="warn">فترة تجريبية — باقي ${l.left} يوم</span>`}</p><p>كود الجهاز: <b dir="ltr">${l.machine}</b></p>${l.mode!='licensed'?`<label>كود التفعيل<textarea id="lk2" style="min-height:70px;direction:ltr"></textarea></label><button class="b sm" onclick="actLic()">تفعيل</button>`:''}`:''}</div><div class="card"><b>دليل الاستخدام السريع</b>${HELP.map(h=>`<details><summary>${h[0]}</summary><p>${h[1]}</p></details>`).join('')}</div>`};
const actLic=async()=>{const r=await A.licActivate(val('lk2'));if(!r.ok)msg(r.msg)};
const da2=P.dash;P.dash=()=>{const h=da2(),l=licInfo();return l&&l.mode=='trial'?h.replace('</h2>',`</h2><div class="card warn">⏳ نسخة تجريبية — باقي ${l.left} يوم. للتفعيل افتح صفحة "المساعدة".</div>`):h};

R();
